# Version updates. Security updates are enabled separately in the repo settings and
# still open their own PRs as soon as an advisory lands. Minor and patch bumps are
# grouped so they arrive as one PR per group per week instead of one per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      github-actions:
        patterns: ["*"]
