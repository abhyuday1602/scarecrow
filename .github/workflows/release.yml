name: Release

# Runs when a version tag (v1.2.3) is pushed: lint, test, check the tag matches
# package.json, then create a GitHub Release with generated notes.
#
# Publishing to npm is off until it's set up. To turn it on, configure npm trusted
# publishing for this repo (or add an NPM_TOKEN repository secret), then set the
# repository variable NPM_PUBLISH to "true" (Settings → Secrets and variables →
# Actions → Variables). Publishes use npm provenance, so the package page links back
# to this workflow run and commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance / trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
