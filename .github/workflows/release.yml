name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. Uses npm provenance, so the
# package page links back to this workflow run and commit. Requires either npm trusted
# publishing configured for this repo, or an NPM_TOKEN repository secret.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # needed for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
